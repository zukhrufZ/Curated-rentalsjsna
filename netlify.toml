[build]
  publish = "."
  functions = "netlify/functions"

# SPA fallback — every route serves index.html, router takes over client-side.
# This must be last so /data/*.json and /js/*.js still resolve as real files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"
